# ==============================
# Server
# ==============================
server.port=8085

# ==============================
# MySQL 8 Datasource
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/security_jwt_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Wipro@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT Config
# ==============================
# 256-bit+ secret, base64 or plain (min 32 chars for HS256). CHANGE THIS IN PRODUCTION.
app.jwt.secret=ThisIsADemoSecretKeyForJwtHS256AlgoChangeItInProdEnvironment123456
# Access token validity in milliseconds (1 hour)
app.jwt.expiration-ms=3600000
# Refresh token validity in milliseconds (7 days)
app.jwt.refresh-expiration-ms=604800000

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.training.security=DEBUG
